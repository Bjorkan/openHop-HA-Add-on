configuration:
  branch_or_pr:
    name: Repeater branch or pull request
    description: Upstream branch (for example "main") or pull-request number
      (for example "42") from openhop-dev/openhop_repeater to run. Applied on
      boot. Invalid values and failed installs stop the app.
  core_branch_or_pr:
    name: Core branch or pull request (optional)
    description: Upstream branch (for example "main") or pull-request number
      (for example "7") from openhop-dev/openhop_core to install on top of
      the repeater install. Leave empty to use the core pinned by the
      repeater. Invalid values and failed installs stop the app.
